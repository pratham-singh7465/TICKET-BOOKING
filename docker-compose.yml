services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_init.up.sql:/docker-entrypoint-initdb.d/001_init.up.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 10
      
  api:
    build:
      context: .
      dockerfile: docker/DockerFile
    ports:
      - "8080:8080"
    environment:
      - APP_NAME=TicketBooking
      - LOG_LEVEL=info
      - HTTP_ADDR=:8080
      - DB_URL=postgres://app:app@db:5432/appdb?sslmode=disable
      - DB_MAX_CONNS=50
      - DB_MIN_CONNS=10
      - DB_MAX_CONN_LIFETIME=15m
      - DB_MAX_CONN_IDLE_TIME=5m
      - RATE_LIMIT_RPS=200
      - RATE_LIMIT_BURST=5000
    depends_on:
      db:
        condition: service_healthy
  
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

volumes:
  pgdata:


