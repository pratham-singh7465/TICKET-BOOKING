openapi: 3.0.3
info:
  title: Ticket Booking API
  description: |
    Seat reservation study API. Identity for protected routes comes from
    `Authorization: Bearer <token>` (e.g. dev token `token-user1` for user `user1`).
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: Local
tags:
  - name: health
  - name: auth
  - name: admin
  - name: reservations
  - name: observability
paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  app:
                    type: string
  /readyz:
    get:
      tags: [health]
      summary: Readiness (DB ping)
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  db:
                    type: string
                    example: ok
        "503":
          description: Database unreachable
  /metrics:
    get:
      tags: [observability]
      summary: Prometheus metrics
      responses:
        "200":
          description: Prometheus text exposition format
  /api/v1/shows:
    post:
      tags: [admin]
      summary: Create show (admin)
      description: Inserts a show and all seats in `available` state in one transaction.
      security:
        - adminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShowRequest"
      responses:
        "201":
          description: Show created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Show"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Admin credentials required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/shows/{showID}:
    get:
      tags: [shows]
      summary: Show state and per-seat status
      description: Expires overdue holds before read. Public (no auth).
      parameters:
        - name: showID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Show with seat list and counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowState"
        "404":
          description: Show not found
  /api/v1/shows/{showID}/reserve:
    post:
      tags: [reservations]
      summary: Reserve seats (authenticated)
      description: |
        **All-or-nothing:** every requested seat must be `available` or the request declines with 409.
        Identity is taken from the bearer token only (body `user_id` is ignored).
        Idempotency via `Idempotency-Key` header or `idempotency_key` in JSON; same key + same seats replays the original 201; same key + different seats → 409.
      security:
        - bearerAuth: []
      parameters:
        - name: showID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveRequest"
      responses:
        "201":
          description: Seats held for payment (status held)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid user token
        "404":
          description: Show not found
        "409":
          description: Seat unavailable, per-user limit, or idempotency conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/reservations/{reservationID}/confirm:
    post:
      tags: [reservations]
      summary: Confirm after payment
      description: Moves a pending hold to confirmed. Optional PAYMENT_SIM_DELAY env simulates PSP latency.
      security:
        - bearerAuth: []
      parameters:
        - name: reservationID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "401":
          description: Unauthorized
        "403":
          description: Not owner
        "404":
          description: Not found
        "409":
          description: Hold expired or invalid state
  /api/v1/reservations/{reservationID}/cancel:
    post:
      tags: [reservations]
      summary: Cancel pending hold (owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: reservationID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Released
        "401":
          description: Unauthorized
        "403":
          description: Not owner
        "404":
          description: Not found
        "409":
          description: Cannot cancel confirmed reservation
  /api/v1/me:
    get:
      tags: [auth]
      summary: Current user (token-derived)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated user id from token
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    example: user1
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Dev tokens: token-user1 … token-user5"
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
      description: "Admin secret (or Authorization Bearer with same value). Set ADMIN_API_KEY in env."
  schemas:
    CreateShowRequest:
      type: object
      required: [name, seats, price_paise]
      properties:
        name:
          type: string
          example: friday-night
        seats:
          type: array
          items:
            type: string
          example: ["A1", "A2", "A3"]
        price_paise:
          type: integer
          format: int64
          example: 25000
        per_user_limit:
          type: integer
          description: Optional; defaults to 4
          example: 4
    ReserveRequest:
      type: object
      required: [seats]
      properties:
        seats:
          type: array
          items:
            type: string
          example: ["A1"]
        idempotency_key:
          type: string
          example: req-abc-123
    Reservation:
      type: object
      properties:
        reservation_id:
          type: string
          format: uuid
        show_id:
          type: string
          format: uuid
        user_id:
          type: string
        seats:
          type: array
          items:
            type: string
        amount_paise:
          type: integer
          format: int64
        status:
          type: string
          enum: [held, confirmed]
        held_until:
          type: string
          format: date-time
        idempotency_key:
          type: string
    ShowState:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        price_paise:
          type: integer
          format: int64
        per_user_limit:
          type: integer
        counts:
          type: object
          properties:
            available:
              type: integer
            held:
              type: integer
            confirmed:
              type: integer
            total:
              type: integer
        seats:
          type: array
          items:
            type: object
            properties:
              seat_code:
                type: string
              status:
                type: string
                enum: [available, held, confirmed]
    Show:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        price_paise:
          type: integer
          format: int64
        per_user_limit:
          type: integer
        seats:
          type: array
          items:
            type: object
            properties:
              seat_code:
                type: string
              status:
                type: string
                enum: [available, held, confirmed]
    Error:
      type: object
      properties:
        error:
          type: string
