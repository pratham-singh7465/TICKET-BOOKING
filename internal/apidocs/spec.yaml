openapi: 3.0.3
info:
  title: Ticket Booking API
  description: |
    Seat reservation study API. Identity for protected routes comes from
    `Authorization: Bearer <token>` (e.g. dev token `token-user1` for user `user1`).
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: Local
tags:
  - name: health
  - name: auth
  - name: admin
  - name: observability
paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  app:
                    type: string
  /readyz:
    get:
      tags: [health]
      summary: Readiness (DB ping)
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  db:
                    type: string
                    example: ok
        "503":
          description: Database unreachable
  /metrics:
    get:
      tags: [observability]
      summary: Prometheus metrics
      responses:
        "200":
          description: Prometheus text exposition format
  /api/v1/shows:
    post:
      tags: [admin]
      summary: Create show (admin)
      description: Inserts a show and all seats in `available` state in one transaction.
      security:
        - adminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShowRequest"
      responses:
        "201":
          description: Show created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Show"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Admin credentials required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/me:
    get:
      tags: [auth]
      summary: Current user (token-derived)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated user id from token
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    example: user1
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Dev tokens: token-user1 … token-user5"
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
      description: "Admin secret (or Authorization Bearer with same value). Set ADMIN_API_KEY in env."
  schemas:
    CreateShowRequest:
      type: object
      required: [name, seats, price_paise]
      properties:
        name:
          type: string
          example: friday-night
        seats:
          type: array
          items:
            type: string
          example: ["A1", "A2", "A3"]
        price_paise:
          type: integer
          format: int64
          example: 25000
        per_user_limit:
          type: integer
          description: Optional; defaults to 4
          example: 4
    Show:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        price_paise:
          type: integer
          format: int64
        per_user_limit:
          type: integer
        seats:
          type: array
          items:
            type: object
            properties:
              seat_code:
                type: string
              status:
                type: string
                enum: [available, held, confirmed]
    Error:
      type: object
      properties:
        error:
          type: string
