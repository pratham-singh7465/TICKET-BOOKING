services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    ports:
      # Host 5435 avoids clashing with a local/Windows Postgres on 5432 (DBeaver on Windows).
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: app
      PGPASSWORD: app
      PGDATABASE: appdb
    volumes:
      - ./migrations:/migrations:ro
      - ./scripts/docker-migrate.sh:/docker-migrate.sh:ro
    entrypoint: ["/bin/sh", "/docker-migrate.sh"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/DockerFile
    ports:
      - "8080:8080"
    environment:
      - APP_NAME=TicketBooking
      - ADMIN_API_KEY=dev-admin-change-me
      - LOG_LEVEL=info
      - HTTP_ADDR=:8080
      - DB_URL=postgres://app:app@db:5432/appdb?sslmode=disable
      - DB_MAX_CONNS=50
      - DB_MIN_CONNS=10
      - DB_MAX_CONN_LIFETIME=15m
      - DB_MAX_CONN_IDLE_TIME=5m
      - RATE_LIMIT_RPS=200
      - RATE_LIMIT_BURST=5000
      - HOLD_TTL=5m
      - PAYMENT_SIM_DELAY=0
      - REDIS_URL=redis://redis:6379/0
      - IDEMPOTENCY_CACHE_TTL=24h
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

volumes:
  pgdata:
